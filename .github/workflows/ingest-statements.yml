name: Ingest Codeforces statements

# Fetch official CF HTML outside Railway (Cloudflare blocks datacenter IPs),
# then upsert into SolveX via the admin HTML ingest endpoint.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max problems to ingest this run"
        required: false
        default: "40"
      min_contest_id:
        description: "Optional minimum contest id filter"
        required: false
        default: "2248"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fetch deps
        run: pip install "curl_cffi>=0.7" "beautifulsoup4>=4.12" "lxml>=5" "requests>=2.31"

      - name: Fetch + upsert statements
        env:
          SOLVEX_API_BASE: ${{ vars.SOLVEX_API_BASE || 'https://web-production-3ea15.up.railway.app' }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '40' }}
          MIN_CONTEST_ID: ${{ github.event.inputs.min_contest_id || '2248' }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_API_KEY}" ]; then
            echo "ADMIN_API_KEY secret is required" >&2
            exit 1
          fi
          python - <<'PY'
          import json, os, re, time, urllib.request
          from curl_cffi import requests as cf_requests

          base = os.environ["SOLVEX_API_BASE"].rstrip("/")
          key = os.environ["ADMIN_API_KEY"]
          limit = int(os.environ.get("LIMIT") or "40")
          min_contest = int(os.environ.get("MIN_CONTEST_ID") or "0")

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  base + path,
                  data=data,
                  method=method,
                  headers={
                      "Content-Type": "application/json",
                      "X-Admin-Key": key,
                  },
              )
              with urllib.request.urlopen(req, timeout=120) as resp:
                  return json.loads(resp.read().decode())

          stats = api("GET", "/api/v1/admin/statements/ingest/stats")
          ids = stats.get("missing_newest") or []
          chosen = []
          for pid in ids:
              m = re.match(r"^(\d+)([A-Za-z][A-Za-z0-9]*)$", pid)
              if not m:
                  continue
              if int(m.group(1)) < min_contest:
                  continue
              chosen.append((pid, int(m.group(1)), m.group(2)))
              if len(chosen) >= limit:
                  break
          print("selected", [c[0] for c in chosen])
          items = []
          for pid, contest_id, index in chosen:
              url = f"https://codeforces.com/problemset/problem/{contest_id}/{index}"
              r = cf_requests.get(url, impersonate="chrome131", timeout=30)
              if r.status_code != 200 or "problem-statement" not in r.text:
                  print("fetch_fail", pid, r.status_code, len(r.text or ""))
                  continue
              items.append({"problem_id": pid, "html": r.text})
              time.sleep(2.5)
          if not items:
              raise SystemExit("no HTML fetched; Cloudflare may be blocking this runner")
          # upsert in chunks of 5
          total = {"succeeded": 0, "failed": 0, "partial": 0, "asset_required": 0}
          for i in range(0, len(items), 5):
              chunk = items[i:i+5]
              out = api("POST", "/api/v1/admin/statements/ingest-html", {"items": chunk})
              for k in total:
                  total[k] += int(out.get(k) or 0)
              print("chunk", i, out.get("succeeded"), out.get("failed"))
          print(json.dumps({"total": total, "coverage": out.get("coverage")}, indent=2))
          if total["succeeded"] + total["partial"] + total["asset_required"] <= 0:
              raise SystemExit("ingest produced no usable statements")
          PY
